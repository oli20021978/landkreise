<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function status(m,err){$('msg').textContent=m;$('bar').style.background=err?'#b02a37':'rgba(0,0,0,.85)';}
window.onerror=(m,u,l)=>status('JS-Fehler Zeile '+l+': '+m,true);

// Normalisierung: Umlaute auflösen, nur a-z0-9 behalten
const norm=s=>s.normalize('NFC').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
// Namensvarianten (exakt zuerst, dann ohne Präfix/Suffix "Kreis/Landkreis/Stadt", dann Sankt->St)
function variants(n){
  const b=norm(n),o=[b];
  for(const x of [b.replace(/^(landkreis|kreisfreiestadt|stadtkreis|kreis|stadt)/,''),b.replace(/(landkreis|kreis)$/,''),b.replace(/^sankt/,'st'),b.replace(/(staedte|stadtkreis)$/,'')])
    if(x&&!o.includes(x))o.push(x);
  return o;
}
function parse(t){
  return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.*?)[;\t:,]\s*(\d+)\s*$/); if(!m)return null;
    let name=m[1].replace(/^"|"$/g,'').trim(),typ=null;
    const t2=name.match(/^(.*?)\s*\((lkr|kr)\)$/i); if(t2){name=t2[1];typ='lkr';}
    return {raw:m[1].trim(),name,typ,count:+m[2]};
  }).filter(Boolean);
}
function info(f){
  const p=f.properties||{};
  const bez=p.BEZ||p.TYPE_3||p.TYPE_2||'';
  return {name:p.GEN||p.NAME_3||p.NAME_2||p.name||'',bez,stadt:/stadt|städte|staedte/i.test(bez)&&!/landkreis/i.test(bez)};
}
// Zuordnung von der Liste aus: jeder Eintrag sucht sich genau EIN Gebiet
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return p[n];}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function parseAlias(t){const m={};t.split(/\r?\n/).forEach(l=>{const i=l.indexOf('=');if(i>0)m[norm(l.slice(0,i))]=l.slice(i+1).trim();});return m;}
function match(entries){
  const al=parseAlias($('alias').value),idx=new Map();
  feats.forEach(f=>{const i=info(f);for(const v of variants(i.name)){
    if(!idx.has(v))idx.set(v,{s:[],l:[]}); idx.get(v)[i.stadt?'s':'l'].push(f);}});
  const val=new Map(),rep={none:[],amb:[],dup:[],fuzzy:[]},rest=[];
  const find=(name,typ)=>{const order=typ==='lkr'?['l']:['s','l'];
    for(const v of variants(name)){const x=idx.get(v);if(!x)continue;for(const k of order)if(x[k].length)return x[k];}return null;};
  for(const e of entries){
    const a=al[norm(e.raw)];
    if(a&&a.includes('|')){let n=0;for(const t of a.split('|')){const g=find(t.trim(),null);if(g&&!val.has(g[0])){val.set(g[0],e);n++;}}if(n)continue;}
    let c=(a&&!a.includes('|')&&find(a,e.typ))||find(e.name,e.typ);
    if(!c){rest.push(e);continue;}
    if(c.length>1)rep.amb.push(e);
    if(val.has(c[0]))rep.dup.push([e,val.get(c[0])]);else val.set(c[0],e);
  }
  // Fuzzy-Suche für alles, was noch fehlt (nur freie Gebiete)
  for(const e of rest){
    const nv=variants(e.name),sc=[];
    for(const f of feats){if(val.has(f))continue;const i=info(f);if(e.typ==='lkr'&&i.stadt)continue;
      sc.push([Math.max(...variants(i.name).flatMap(v=>nv.map(w=>sim(w,v)))),f]);}
    sc.sort((x,y)=>y[0]-x[0]);
    if(sc.length&&sc[0][0]>=0.82){val.set(sc[0][1],e);rep.fuzzy.push([e,sc[0][1],sc[0][0]]);}
    else rep.none.push(Object.assign({},e,{sug:sc.slice(0,2).filter(x=>x[0]>=0.5).map(x=>info(x[1]).name)}));
  }
  return {val,rep};
}
const color=n=>n>=10?'#a50026':n>=4?'#f46d43':n>=2?'#fdae61':'#fee08b';
let map,layer,feats=null,lastVal=new Map();
const save=()=>{try{localStorage.setItem('lk_daten',$('daten').value);localStorage.setItem('lk_alias',$('alias').value);}catch(e){}
  if(ghCfg()){clearTimeout(ghTimer);ghTimer=setTimeout(()=>{ghTimer=null;ghPush().catch(e=>gh('GitHub-Fehler: '+e.message));},800);}};
function editor(f){
  const i=info(f),e=lastVal.get(f),d=document.createElement('div');
  d.innerHTML='<b>'+esc(i.name)+'</b> ('+esc(i.bez)+')<br>'+(e?(e.raw!==i.name?'<small>Eintrag: '+esc(e.raw)+'</small><br>':''):'<i>nicht in Liste</i><br>')+
    '<button class="m">−</button> <input type="number" min="0" value="'+(e?e.count:0)+'" style="width:64px;font-size:16px;text-align:center"> <button class="p">+</button> <button class="s">OK</button>';
  const inp=d.querySelector('input');
  d.querySelector('.m').onclick=()=>{inp.value=Math.max(0,(+inp.value||0)-1);};
  d.querySelector('.p').onclick=()=>{inp.value=(+inp.value||0)+1;};
  d.querySelector('.s').onclick=()=>{setCount(f,Math.max(0,+inp.value||0));map.closePopup();};
  L.DomEvent.disableClickPropagation(d);
  return d;
}
function setCount(f,n){
  const e=lastVal.get(f),ta=$('daten'),lines=ta.value.split('\n');
  if(e){let done=false;
    for(let k=0;k<lines.length&&!done;k++){const m=lines[k].trim().match(/^(.*?)([;\t:,]\s*)(\d+)\s*$/);
      if(m&&m[1].trim()===e.raw){lines[k]=m[1]+m[2]+n;done=true;}}
    if(!done)lines.push(e.raw+';'+n);
  }else{const i=info(f);lines.push((i.stadt?i.name:i.name+' (Lkr)')+';'+n);}
  ta.value=lines.join('\n');save();render();
}
function render(){
  if(!feats)return;
  const entries=parse($('daten').value),{val,rep}=match(entries);lastVal=val;
  if(layer)map.removeLayer(layer);
  layer=L.geoJSON({type:'FeatureCollection',features:feats},{
    style:f=>{const e=val.get(f);return e&&e.count>0
      ?{color:'#6a1b9a',weight:1.6,fillColor:color(e.count),fillOpacity:.45}
      :{color:'#7b2cbf',weight:1.2,fillColor:'#999',fillOpacity:.05};},
    onEachFeature:(f,l)=>{l.bindPopup(()=>editor(f));}
  }).addTo(map);
  const col=[...val.values()].filter(e=>e.count>0).length;
  const lost=rep.none.filter(e=>e.count>0);
  status(col+' Gebiete eingefärbt · '+val.size+'/'+entries.length+' Einträge zugeordnet'+(lost.length?' · '+lost.length+' mit Anzahl>0 NICHT gefunden':''),lost.length>0);
  const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  $('report').innerHTML='<b>Ungefähr zugeordnet, bitte prüfen ('+rep.fuzzy.length+')</b>'+li(rep.fuzzy.map(([e,f,x])=>esc(e.raw)+' → '+esc(info(f).name)+' ('+Math.round(x*100)+'%)'))+
    '<b style="color:#b02a37">Nicht gefunden, Anzahl &gt; 0 ('+lost.length+')</b>'+li(lost.map(e=>esc(e.raw)+' ('+e.count+')'+(e.sug&&e.sug.length?' → vielleicht: '+esc(e.sug.join(' / ')):'')))+
    '<b>Nicht gefunden, Anzahl 0 ('+(rep.none.length-lost.length)+')</b><details><summary>anzeigen</summary>'+li(rep.none.filter(e=>!e.count).map(e=>esc(e.raw)))+'</details>'+
    '<b>Mehrdeutig ('+rep.amb.length+')</b>'+li(rep.amb.map(e=>esc(e.raw)))+
    '<b>Gebiet doppelt belegt ('+rep.dup.length+')</b>'+li(rep.dup.map(([a,b])=>esc(a.raw)+' ↔ '+esc(b.raw)));
}
$('tgl').onclick=()=>{const p=$('panel');p.style.display=p.style.display==='flex'?'none':'flex';};
try{const sd=localStorage.getItem('lk_daten'),sa=localStorage.getItem('lk_alias');if(sd)$('daten').value=sd;if(sa)$('alias').value=sa;}catch(e){}
$('apply').onclick=()=>{save();render();};
$('copy').onclick=()=>{const t=$('daten');t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand('copy');}status('Liste kopiert');};
$('reset').onclick=()=>{if(confirm('Gespeicherte Änderungen verwerfen und den Stand der Datei laden?')){try{localStorage.removeItem('lk_daten');localStorage.removeItem('lk_alias');}catch(e){}location.reload();}};
$('shownames').onclick=()=>{const v=$('names');v.style.display='block';
  v.value=feats?feats.map(f=>{const i=info(f);return i.name+';'+i.bez;}).join('\n'):'(Karte noch nicht geladen)';v.select();};

map=L.map('map').setView([51.1657,10.4515],6);
L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
status('Lade Kreisgrenzen…');
fetch('https://cdn.jsdelivr.net/gh/isellsoap/deutschlandGeoJSON@master/4_kreise/2_hoch.geo.json')
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(d=>{feats=d.features;
    if(feats.length&&!info(feats[0]).name)status('Keine Namensfelder gefunden. Properties: '+Object.keys(feats[0].properties||{}).join(', '),true);
    else render();})
  .catch(e=>status('GeoJSON-Fehler: '+e.message,true));
// Punkt-in-Polygon, um zu zeigen, in welchem Gebiet der Standort liegt
function inRing(pt,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];
  if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c;}return c;}
const inPoly=(pt,rs)=>inRing(pt,rs[0])&&!rs.slice(1).some(r=>inRing(pt,r));
function findFeature(lat,lng){const pt=[lng,lat];
  return feats&&feats.find(f=>{const g=f.geometry;if(!g)return false;
    return g.type==='Polygon'?inPoly(pt,g.coordinates):g.type==='MultiPolygon'&&g.coordinates.some(q=>inPoly(pt,q));});}
let mk=null;
function setPos(ll,src,zoom){
  if(!mk)mk=L.marker(ll).addTo(map);else mk.setLatLng(ll);
  const f=findFeature(ll[0],ll[1]),i=f&&info(f),e=f&&lastVal.get(f);
  mk.bindPopup('<b>Standort</b> ('+esc(src)+')<br>'+ll[0].toFixed(4)+', '+ll[1].toFixed(4)+'<br>'+
    (f?esc(i.name)+(e?' – Anzahl <b>'+e.count+'</b>':' – nicht in Liste'):'kein Gebiet gefunden')).openPopup();
  if(zoom)map.setView(ll,9);
}
map.on('click',e=>{if($('pick').checked)setPos([e.latlng.lat,e.latlng.lng],'per Klick');});
const geo=t=>{$('geo').textContent=t;};
function getLoc(){
  if(!navigator.geolocation){geo('Browser unterstützt keinen Standort');return;}
  geo('frage Standort an…');
  navigator.geolocation.getCurrentPosition(
    p=>{setPos([p.coords.latitude,p.coords.longitude],'Browser, ±'+Math.round(p.coords.accuracy)+' m',true);geo('Browser-Standort: OK');},
    e=>geo('Browser-Standort fehlgeschlagen ('+(['','Zugriff verweigert','Position nicht verfügbar','Zeitüberschreitung'][e.code]||e.message)+')'+(window.isSecureContext?'':' – Seite ist nicht per HTTPS geöffnet, dann blockieren Browser den Standort meist')),
    {enableHighAccuracy:true,timeout:15000});
}
$('loc').onclick=getLoc;
$('hide').onclick=()=>{const b=$('barbody'),h=b.style.display==='none';b.style.display=h?'contents':'none';$('hide').textContent=h?'▲':'▼';$('bar').classList.toggle('min',!h);};
getLoc();

// ---- GitHub-Sync: Liste + Zuordnungen als JSON-Datei in einem Repo ----
const GH_KEY='lk_gh';
let ghSha=null,ghTimer=null;
const gh=t=>{$('ghmsg').textContent=t;};
function ghCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY)||'null');}catch(e){return null;}}
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,''))));
function ghReq(c,method,body){
  const h={'Accept':'application/vnd.github+json'};if(c.token)h.Authorization='Bearer '+c.token;
  return fetch('https://api.github.com/repos/'+c.repo+'/contents/'+c.path+(method==='GET'?'?t='+Date.now():''),
    {method,headers:h,body:body&&JSON.stringify(body),cache:'no-store'});
}
async function ghLoad(){
  const c=ghCfg();if(!c)return false;
  const r=await ghReq(c,'GET');
  if(r.status===404){ghSha=null;return 'none';}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();ghSha=j.sha;const o=JSON.parse(b64d(j.content));
  if(o.daten!=null)$('daten').value=o.daten;if(o.alias!=null)$('alias').value=o.alias;
  return 'ok';
}
async function ghPush(){
  const c=ghCfg();if(!c)return;
  if(!c.token){gh('Kein Token – Änderung nur lokal gespeichert');return;}
  const body={message:'Update Landkreise',content:b64e(JSON.stringify({daten:$('daten').value,alias:$('alias').value})),sha:ghSha||undefined};
  const r=await ghReq(c,'PUT',body);
  if(r.ok){ghSha=(await r.json()).content.sha;gh('GitHub: gespeichert');return;}
  if(r.status===409||r.status===422){await ghLoad();render();gh('Anderes Gerät hat zwischenzeitlich gespeichert – Stand neu geladen, bitte Änderung wiederholen');return;}
  gh('Speichern fehlgeschlagen (HTTP '+r.status+')'+(r.status===401||r.status===403||r.status===404?' – Token/Repo prüfen':''));
}
{const c=ghCfg();if(c){$('ghrepo').value=c.repo;$('ghpath').value=c.path;$('ghtoken').value=c.token||'';}}
$('ghconnect').onclick=async()=>{
  const c={repo:$('ghrepo').value.trim(),path:$('ghpath').value.trim()||'daten.json',token:$('ghtoken').value.trim()};
  if(!/^[^\/\s]+\/[^\/\s]+$/.test(c.repo)){gh('Bitte Benutzer/Repository angeben');return;}
  try{localStorage.setItem(GH_KEY,JSON.stringify(c));gh('verbinde…');
    const r=await ghLoad();if(r==='none')await ghPush();
    render();if(r==='ok')gh('Verbunden, Stand von GitHub geladen');}
  catch(e){gh('Fehler: '+e.message+' – Repo/Token prüfen');}
};
$('ghoff').onclick=()=>{try{localStorage.removeItem(GH_KEY);}catch(e){}gh('Getrennt (nur noch lokal)');};
if(ghCfg())ghLoad().then(r=>{if(r)render();gh(r==='none'?'GitHub: Datei noch nicht vorhanden':'GitHub: Stand geladen');}).catch(e=>gh('GitHub-Laden fehlgeschlagen: '+e.message));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ghCfg()&&!ghTimer)ghLoad().then(r=>{if(r)render();}).catch(()=>{});});
</script></body></html>
